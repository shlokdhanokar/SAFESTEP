[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safestep"
version = "1.0.0"
description = "Real-time obstacle detection and audio guidance for visually impaired users"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Shlok Rajesh Dhanokar" }]
keywords = ["accessibility", "computer-vision", "assistive-technology", "opencv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
# Cross-platform earcon playback. Not required: on Windows the stdlib winsound
# backend is used, and everywhere else playback degrades to a logged no-op.
audio = ["simpleaudio>=1.0.4"]
# Browser dashboard. Optional so the core app still runs on a headless Pi.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.4", "flake8>=6.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.scripts]
safestep = "safestep.cli:main"

[project.urls]
Homepage = "https://github.com/shlokdhanokar/SAFESTEP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safestep = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:safestep.*"]

[tool.flake8]
max-line-length = 127
max-complexity = 10
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]
